[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu-lang"
version = "0.10.0"
description = "mu: a small indentation language that transpiles to Python, with a hook for a project's helper library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ['tomli; python_version < "3.11"']

[project.optional-dependencies]
ide = ["jedi"]
test = ["pytest", "jedi", "dsa-py"]

[tool.setuptools.packages.find]
include = ["mulang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731", "E741", "B007", "B905"]

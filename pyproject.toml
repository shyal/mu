[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu-language"
version = "0.11.0"
description = "mu: a small indentation language that transpiles to Python, with a hook for a project's helper library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shyal" }]
keywords = ["language", "transpiler", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
]
dependencies = ['tomli; python_version < "3.11"']

[project.scripts]
mu = "mulang.__main__:cli"
mu-repl = "mulang.repl:main"

[project.entry-points."pygments.lexers"]
mu = "mulang.pygments_lexer:MuLexer"

[project.urls]
Homepage = "https://github.com/shyal/mu"
Repository = "https://github.com/shyal/mu"
Documentation = "https://www.shyal.com/mu/"

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5"]
ide = ["jedi"]
test = ["pytest", "jedi"]

[tool.setuptools.packages.find]
include = ["mulang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731", "E741", "B007", "B905"]

# Releases vscode/ on a tag vscode-v<version>: the adapter tests run, the
# .vsix is packaged and attached to a GitHub release. Install it with
# `code --install-extension mu-<version>.vsix`, or "Install from VSIX" in
# Cursor, VSCodium or Windsurf. Neither registry is used: the VS Code
# Marketplace needs a Microsoft account and Open VSX an Eclipse account,
# and neither would open one. The tag's version must equal
# vscode/package.json's.
name: vscode

on:
  push:
    tags: ["vscode-v*"]
  pull_request:
    paths: ["vscode/**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          tag="${GITHUB_REF_NAME#vscode-v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
      - run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/*.vsix
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "mu for VS Code ${GITHUB_REF_NAME#vscode-v}" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
